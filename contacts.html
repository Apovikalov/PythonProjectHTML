<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="row mt-5"></div>
<h1 align="center"> Контакты </h1>
<div class="row mt-5"></div>
<div class="row">
    <div class="col-1"></div>
    <div class="col-4">
        <form class="border" style="padding: 10px; border-radius: 10px">
            <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Имя</label>
                <input type="text" class="form-control" id="exampleFormControlInput1">
            </div>
            <div class="mb-3">
                <label for="exampleFormControlInput2" class="form-label">Почта</label>
                <input type="email" class="form-control" id="exampleFormControlInput2">
            </div>
            <div class="mb-3">
                <label for="exampleFormControlTextarea1" class="form-label">Сообщение</label>
                <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary"> Отправить </button>
        </form>
    </div>
    <div class="col-1"></div>
    <div class="col-5">
        <h3>Наши контакты</h3>
        <p> While these feedback styles cannot be styled with CSS,
        you can still customize the feedback text through JavaScript.</p>
    </div>
    <div class="col-1"></div>
</div>
</body>
</html>
